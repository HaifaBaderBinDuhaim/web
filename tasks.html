<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Tasks</title>
<link rel="stylesheet" href="tasksstyle.css" />
<script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="body-sidebar">
<div class="layout">

<!-- Sidebar -->
<div class="sidebar">
<div class="logo">
<i data-lucide="flower-2"></i>
<span>Study Planner</span>
</div>

<div class="menu">
<div class="item">
<i data-lucide="home"></i>
<a href="dashboard.html" class="link">Home</a>
</div>

<div class="item">
<i data-lucide="book-open"></i>
<a href="courses2.html" class="link">Courses</a>
</div>

<div class="item">
<i data-lucide="calendar-check"></i>
<a href="availability.html" class="link">Availability</a>
</div>

<div class="item">
<i data-lucide="layers-3"></i>
<a href="planner.html" class="link">Study Plan</a>
</div>

<div class="item">
<i data-lucide="bar-chart-3"></i>
<a href="stats.html" class="link">Statistics & Progress</a>
</div>

<div class="item active-item">
<i data-lucide="bell"></i>
<a href="tasks.html" class="link">Deadlines</a>
</div>

<div class="item">
<i data-lucide="bot"></i>
<a href="ai-helper.html" class="link">AI assistant</a>
</div>

<div class="item">
<i data-lucide="log-out"></i>
<a href="login.html" class="link">Logout</a>
</div>
</div>
</div>

<!-- Main -->
<div class="page-container">

<div class="main-header">
<h1>Deadlines & Exams</h1>
</div>


<div class="table-section">
<h2>Your Tasks</h2>

<table id="tasksTable">
<tr>
<th>Status</th>
<th>Task</th>
<th>Course</th>
<th>Type</th>
<th>Date</th>
<th>Priority</th>
<th>Actions</th>
</tr>
</table>
</div>


<div class="form-section">
<h2>Add Task</h2>

<form id="taskForm">

<div class="form-row">
<label>Task Title:</label>
<input type="text" id="title" required />
</div>

<div class="form-row">
<label>Course:</label>
<select id="course">
<option>Math</option>
<option>Computer Science</option>
<option>English</option>
</select>
</div>

<div class="form-row">
<label>Type:</label>
<select id="type">
<option>Assignment</option>
<option>Exam</option>
</select>
</div>

<div class="form-row">
<label>Due Date:</label>
<input type="date" id="date" required />
</div>

<div class="form-row">
<label>Priority:</label>
<select id="priority">
<option>High</option>
<option>Medium</option>
<option>Low</option>
</select>
</div>

<div class="button-row">
<input type="submit" value="Add Task" />
</div>

</form>
</div>

<a href="dashboard.html" class="back-btn">Go to Dashboard</a>

</div>
</div>

<script>
lucide.createIcons();
</script>

<!-- ربط الجافاسكربت -->
<script src="tasks.js"></script>

</body>
</html>
