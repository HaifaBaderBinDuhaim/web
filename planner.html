<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner</title>
    <link rel="stylesheet" href="plannerstyle.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="app-body">

    <div class="app-layout">
        
        <div class="sidebar">
            <div class="logo">
                <i data-lucide="flower-2"></i>
                <span>Study Planner</span>
            </div>

            <div class="menu">
                <div class="item">
                    <i data-lucide="home"></i>
                    <a href="dashboardnew.html" class="link">Home</a>
                </div>

                <div class="item">
                    <i data-lucide="book-open"></i>
                    <a href="courses2.html" class="link">Courses</a>
                </div>

                <div class="item active">
                    <i data-lucide="calendar-check"></i>
                    <a href="planner.html" class="link">Planner</a>
                </div>

                <div class="item">
                    <i data-lucide="bar-chart-3"></i>
                    <a href="stats.html" class="link">Statistics & Progress</a>
                </div>

                <div class="item">
                    <i data-lucide="bell"></i>
                    <a href="tasks.html" class="link">Deadlines</a>
                </div>

                <div class="item">
                    <i data-lucide="bot"></i>
                    <a href="ai-helper.html" class="link">AI assistant</a>
                </div>

                <div class="item logout-item">
                    <i data-lucide="log-out"></i>
                    <a href="logIn.html" class="link">Logout</a>
                </div>
            </div>
        </div>

        <div class="planner-container">
            <h1 class="main-title">Study Plan For The Week !</h1>
            
            <div class="center-btn-container">
                <button id="generatePlanBtn" class="btn-generate">Generate Study Plan</button>
            </div>

            <h2 class="sub-title">Your Weekly Plan</h2>

            <div class="table-responsive">
                <table class="timetable">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Sun</th>
                            <th>Mon</th>
                            <th>Tue</th>
                            <th>Wed</th>
                            <th>Thu</th>
                            <th>Fri</th>
                            <th>Sat</th>
                        </tr>
                    </thead>
                    <tbody id="timetableBody">
                        </tbody>
                </table>
            </div>

            <div class="center-btn-container footer-btn">
                <button class="btn-back" onclick="window.location.href='dashboardnew.html'">Back to Dashboard</button>
            </div>
        </div>

    </div>

    <div id="sessionModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modalTitle">Add New Session</h2>
            
            <form id="sessionForm">
                <input type="hidden" id="sessionId">

                <div class="form-group">
                    <label for="eventTitle">Title / Chapter</label>
                    <input type="text" id="eventTitle" required placeholder="e.g., Ch.1 or Revision">
                </div>

                <div class="form-group">
                    <label for="eventDay">Day</label>
                    <select id="eventDay" required>
                        <option value="Sun">Sun</option>
                        <option value="Mon">Mon</option>
                        <option value="Tue">Tue</option>
                        <option value="Wed">Wed</option>
                        <option value="Thu">Thu</option>
                        <option value="Fri">Fri</option>
                        <option value="Sat">Sat</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="eventCourse">Course</label>
                    <select id="eventCourse" required>
                        </select>
                </div>

                <div class="form-group">
    <label for="startTime">Start Time</label>
    <input type="time" id="startTime" required />
</div>

<div class="form-group">
    <label for="endTime">End Time</label>
    <input type="time" id="endTime" required />
</div>


                <div class="form-group">
                    <label for="eventStatus">Status</label>
                    <select id="eventStatus" required>
                        <option value="Available">Available</option>
                        <option value="Busy">Busy</option>
                    </select>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="repeatWeekly">
                    <label for="repeatWeekly">Repeat weekly</label>
                </div>

                <div class="modal-actions">
                    <button type="submit" id="saveBtn" class="btn-save">Save Session</button>
                    <button type="button" id="deleteBtn" class="btn-delete" style="display: none;">Delete</button>
                </div>
            </form>
        </div>
    </div>

    <script src="planner.js"></script>
</body>
</html>
